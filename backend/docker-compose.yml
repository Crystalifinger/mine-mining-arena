services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    env_file: .env
    environment: { DATABASE_URL: postgres://arena:arena@db:5432/arena }
    depends_on: { db: { condition: service_healthy } }

  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: postgres://arena:arena@db:5432/arena }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  worker:           # blocks, deposits, withdrawals (run exactly one)
    build: .
    command: ["node", "dist/workers/index.js"]
    env_file: .env
    environment: { DATABASE_URL: postgres://arena:arena@db:5432/arena }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  bot:
    build: .
    command: ["node", "dist/bot.js"]
    env_file: .env
    environment: { DATABASE_URL: postgres://arena:arena@db:5432/arena }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  pgdata:
