<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Arena Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --void:#0D0A1F; --pit:#171238; --pit2:#201A4A; --edge:#34296E;
  --ink:#EEEBFF; --dim:#9C96CC;
  --violet:#8A5CFF; --amber:#FFB63D; --ton:#2AA5FF; --ok:#3DDC97; --bad:#FF5C7A;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07051A}
body{font-family:"Bahnschrift","DIN Alternate","Segoe UI Variable Display",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{width:100%;max-width:480px;height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--void);overflow:hidden}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px}
.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:17px;letter-spacing:-.01em}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:var(--pit);border:1px solid var(--edge);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}

main{flex:1;overflow-y:auto;padding:4px 14px 22px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:6px 0 2px}
h3{font-size:16px;font-weight:800}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:14px;line-height:1.4}
.note{color:var(--dim);font-size:12px;margin:12px 2px 0;line-height:1.45}

/* status */
.status{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 8px}
.rankbtn{background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;padding:0}
.rankbtn .rk{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.rankbtn small{color:var(--dim);font-size:12px}
.hp{text-align:right;font-variant-numeric:tabular-nums}
.hp b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hp span{color:var(--dim);font-size:13px;margin-left:4px}
.rankbar{height:4px;background:#0A0720;border-radius:2px;margin-bottom:12px;overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--violet);border-radius:2px;transition:width .5s}

/* rack: the memorable thing */
.rack{position:relative;background:#110D2B;border:1px solid var(--edge);border-radius:16px;padding:12px 10px 8px;box-shadow:inset 0 -50px 70px -40px rgba(255,140,40,.22)}
.fuseRow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:0 4px 6px;font-variant-numeric:tabular-nums}
.fuse{height:6px;border-radius:3px;background:#0A0720;overflow:hidden;margin:0 4px 10px}
.fuse i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--violet),var(--amber))}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 6px 6px;border-bottom:3px solid #2A2160;margin-bottom:8px;position:relative}
.shelf::after{content:"";position:absolute;left:6%;right:6%;bottom:-3px;height:3px;box-shadow:0 7px 16px rgba(255,150,50,.4)}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.slot{width:100%;aspect-ratio:88/64;border-radius:10px;border:1.5px dashed var(--edge);background:rgba(255,255,255,.02);color:var(--dim);cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .15s,background .15s}
.slot.empty:hover{border-color:var(--violet);background:rgba(138,92,255,.1)}
.slot.empty span{font-size:22px;line-height:1}
.slot.filled{border:0;background:none}
.slot:active{transform:scale(.95)}
.miner{width:100%;height:100%;filter:drop-shadow(0 0 5px var(--c))}
.gh{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:13px}
.rackfoot{text-align:center;font-size:12px;color:var(--dim);padding:2px 0 4px}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.led{animation:blink 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.boot .cell{animation:boot .55s ease both;animation-delay:var(--d,0ms)}
@keyframes boot{from{opacity:0;transform:scale(.88);filter:brightness(3)}to{opacity:1;transform:none;filter:none}}
.rack.pulse{animation:rackpulse .9s ease}
@keyframes rackpulse{0%{box-shadow:inset 0 -50px 70px -40px rgba(255,140,40,.22),0 0 0 rgba(255,182,61,0)}30%{box-shadow:inset 0 -60px 80px -30px rgba(255,170,60,.6),0 0 26px rgba(255,182,61,.35)}100%{box-shadow:inset 0 -50px 70px -40px rgba(255,140,40,.22),0 0 0 rgba(255,182,61,0)}}
.float{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-weight:800;font-size:20px;color:var(--amber);pointer-events:none;animation:floatUp 1.5s ease-out forwards;text-shadow:0 0 12px rgba(255,182,61,.6)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

/* claim */
.claim{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--pit);border:1px solid var(--edge);border-radius:14px;padding:12px 14px}
.claim small{display:block;color:var(--dim);font-size:12px;margin-bottom:2px}
.claim b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:-.01em}
.claim span{color:var(--dim);font-size:13px;margin-left:3px}

/* network */
.net{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.net>div{background:var(--pit);border:1px solid var(--edge);border-radius:12px;padding:10px 11px;min-width:0}
.net small{display:block;color:var(--dim);font-size:11.5px;margin-bottom:3px}
.net b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.net em{display:block;font-style:normal;font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.net em.up{color:var(--bad)}
.net em.down{color:var(--ok)}
.blocks{margin-top:14px;background:var(--pit);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.blocks h3{font-size:14px;margin-bottom:6px}
.blocks div{display:grid;grid-template-columns:1.2fr 1.4fr .6fr;gap:6px;font-size:13px;padding:5px 0;border-top:1px solid #241d52;font-variant-numeric:tabular-nums}
.blocks div span:last-child{text-align:right;color:var(--dim)}
.blocks div:first-of-type{border-top:0}
#view .btn.wide{margin-top:12px}

/* buttons */
.btn{font-weight:800;font-size:14px;border:0;border-radius:11px;padding:10px 14px;color:#0D0A1F;cursor:pointer;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.amber{background:var(--amber)}
.btn.ton{background:var(--ton)}
.btn.mine{background:var(--violet);color:#fff}
.btn.ghost{background:var(--pit2);color:var(--ink);border:1px solid var(--edge)}
.btn.wide{width:100%;padding:14px;font-size:15px;margin-top:14px}

/* store / inventory / market rows */
.card,.row{display:flex;gap:12px;align-items:center;background:var(--pit);border:1px solid var(--edge);border-radius:14px;padding:12px;margin-bottom:10px}
.mv,.rv{width:92px;flex:none}
.rv{width:64px}
.mi,.rm{flex:1;min-width:0}
.mi p,.rm p{color:var(--dim);font-size:13px;margin:2px 0 8px}
.rm p{margin-bottom:0}
.pay{display:flex;gap:8px;flex-wrap:wrap}
.ra{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tag{font-size:12px;color:var(--dim)}
.tag.you{color:var(--amber);font-weight:700}
.price{font-weight:800;font-size:16px;color:var(--violet);font-variant-numeric:tabular-nums;text-align:right}
.price small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.chips2{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.chip2{background:var(--pit);border:1px solid var(--edge);color:var(--dim);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip2[aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.empty-state{text-align:center;padding:34px 10px;color:var(--dim);font-size:14px;line-height:1.5}
.empty-state .btn{margin-top:14px}

/* wallet */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bal div{background:var(--pit);border:1px solid var(--edge);border-radius:14px;padding:14px}
.bal small{color:var(--dim);font-size:12px;display:block;margin-bottom:4px}
.bal b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stack{display:grid;gap:10px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#0A0720;border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
.tab{background:none;border:0;color:var(--dim);font-size:11.5px;font-weight:700;padding:9px 0 8px;display:grid;justify-items:center;gap:3px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(5,3,20,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--pit);border-top:1px solid var(--edge);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:21;max-height:86%;overflow-y:auto}
.sheetOpen .scrim{opacity:1;pointer-events:auto}
.sheetOpen .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--edge);margin:0 auto 14px}
.sheet h3{font-size:19px;margin-bottom:10px}
.sum{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.sum>div{width:96px;flex:none}
.sum p{color:var(--dim);font-size:14px}
dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px;margin-top:6px;font-variant-numeric:tabular-nums}
dt{color:var(--dim)}
dd{text-align:right;font-weight:700}
.err{color:var(--bad);font-size:13.5px;margin-top:12px;line-height:1.45}
.field{display:block;margin-top:12px}
.field span{display:block;color:var(--dim);font-size:13px;margin-bottom:6px}
.field input{width:100%;background:#0D0A1F;border:1px solid var(--edge);border-radius:11px;padding:12px;color:var(--ink);font:inherit;font-size:18px;font-weight:700}
.ranklist{display:grid;gap:8px;margin-top:6px}
.rrow{display:flex;justify-content:space-between;align-items:center;background:#0D0A1F;border:1px solid var(--edge);border-radius:11px;padding:11px 13px;font-size:14px}
.rrow.me{border-color:var(--amber)}
.rrow small{color:var(--dim)}

.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);background:#2A2160;border:1px solid var(--violet);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:30;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.copy{display:flex;gap:8px;align-items:center;background:#0D0A1F;border:1px solid var(--edge);border-radius:11px;padding:8px 8px 8px 12px}
.copy code{flex:1;min-width:0;word-break:break-all;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.copy .btn{padding:8px 12px;flex:none}
.reward{color:var(--amber)!important;font-weight:800;margin-top:4px!important}
.tag.ok{color:var(--ok);font-weight:700}
.blocks .mt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #241d52;font-size:14px}
.blocks .mt:first-of-type{border-top:0}
.blocks .mt span{min-width:0;overflow-wrap:anywhere;text-align:left;color:var(--ink)}
.blocks .mt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.blocks .mt .btn{padding:8px 12px;flex:none}
#view>.btn.wide{margin-bottom:6px}
.tabs{grid-template-columns:repeat(6,1fr)}
.tab{font-size:10.5px}
.splash .fail-only{display:none}
.splash.fail .fail-only{display:block}
.splash.fail .ok-only{display:none}
/* splash and login */
.logo{border-radius:50%;filter:drop-shadow(0 0 6px rgba(138,92,255,.65))}
.coin{width:18px;height:18px;border-radius:50%;display:block}
.splash{position:absolute;inset:0;z-index:60;background:#07051A;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:opacity .5s}
.splash.out{opacity:0;pointer-events:none}
.splash .art{position:absolute;top:0;left:0;right:0;aspect-ratio:1/1;background:center/cover no-repeat;transform:scale(1.12);transition:transform 3.4s cubic-bezier(.2,.7,.2,1);-webkit-mask-image:linear-gradient(#000 68%,transparent);mask-image:linear-gradient(#000 68%,transparent)}
.splash.go .art{transform:scale(1)}
.sp-body{position:relative;z-index:1;padding:0 22px calc(env(safe-area-inset-bottom) + 18px)}
.sp-body h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.sp-body .tag{color:var(--dim);font-size:15px;margin:2px 0 18px}
.stage{position:relative;height:124px}
.loader,.login{position:absolute;left:0;right:0;top:0;transition:opacity .45s,transform .45s}
.loader{padding-top:18px}
.loader span{display:block;margin-top:10px;color:var(--dim);font-size:13px}
.bar{height:6px;border-radius:3px;background:#1a1440;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--amber));transition:width 2.7s cubic-bezier(.4,.1,.2,1)}
.splash.go .bar i{width:100%}
.login{opacity:0;transform:translateY(14px);pointer-events:none}
.login .btn.wide{margin-top:0;margin-bottom:10px}
.splash.ready .loader{opacity:0;transform:translateY(-8px)}
.splash.ready .login,.splash.fail .login{opacity:1;transform:none;pointer-events:auto}
.splash.fail .bar i{background:var(--bad)}
.splash.fail .loader{opacity:1;transform:none}
.powered{text-align:center;color:var(--dim);font-size:12.5px;margin-top:14px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" width="30" height="30" alt="">
      Arena Mining
    </div>
    <div class="chips" id="bal"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast" role="status"></div>

  <section class="splash" id="splash" aria-label="Arena Mining">
    <div class="art" id="art"></div>
    <div class="sp-body">
      <h1>Arena Mining</h1>
      <p class="tag">Build your rack. Mine MINE.</p>
      <div class="stage">
        <div class="loader"><div class="bar"><i></i></div><span id="spMsg">Starting the mine</span></div>
        <div class="login">
          <button class="btn mine wide ok-only" id="enterBtn">Continue</button>
          <button class="btn ghost wide fail-only" id="retryBtn">Try again</button>
        </div>
      </div>
      <p class="powered">Powered by GNU/Silver</p>
    </div>
  </section>
</div>

/* ---------- API ---------- */
async function api(path, body){
  const res = await fetch(API_URL + path, {
    method: body ? 'POST' : 'GET',
    headers: {'content-type':'application/json', ...(S.token ? {authorization:'Bearer '+S.token} : {})},
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {}; try { j = await res.json(); } catch {}
  if(!res.ok){ const e = new Error(j.error || 'http_'+res.status); e.code = j.error || 'http_'+res.status; e.data = j; throw e; }
  return j;
}

/* ---------- visuals ---------- */
function minerSVG(t){
  const c = TIER_COLORS[t.tier] || TIER_COLORS[0], spd = [1.4,1,.7,.5,.35][t.tier] || 1;
  const fan=(cx,cy)=>`<g class="fan" style="animation-duration:${spd}s"><circle cx="${cx}" cy="${cy}" r="12" fill="#0B0820" stroke="${c}" stroke-opacity=".5"/>${[0,90,180,270].map(a=>`<ellipse cx="${cx}" cy="${cy-6}" rx="3.2" ry="6" fill="${c}" transform="rotate(${a} ${cx} ${cy})"/>`).join('')}<circle cx="${cx}" cy="${cy}" r="2.4" fill="#0B0820"/></g>`;
  const fans = t.tier>=2 ? fan(24,30)+fan(50,30) : fan(32,30);
  const leds=[18,30,42].map((y,i)=>`<circle class="led" style="animation-delay:${i*.3}s" cx="74" cy="${y}" r="2.6" fill="${c}"/>`).join('');
  return `<svg class="miner" style="--c:${c}" viewBox="0 0 88 60" aria-hidden="true"><rect x="2" y="3" width="84" height="48" rx="9" fill="#1B1644" stroke="${c}" stroke-width="2"/><rect x="2" y="3" width="84" height="8" rx="4" fill="${c}" opacity=".2"/>${fans}${leds}<rect x="12" y="51" width="12" height="5" rx="2" fill="#0B0820"/><rect x="64" y="51" width="12" height="5" rx="2" fill="#0B0820"/></svg>`;
}

/* ---------- data ---------- */
async function loadCore(){
  const [st, net] = await Promise.all([api('/state'), api('/network')]);
  const before = S.me ? num(S.me.pendingRewards) : null;
  S.me = st.me; S.miners = st.miners; S.net = net; S.cfg.slots = st.slots;
  S.blockEnd = Date.now() + net.nextBlockIn*1000; S.lastRefresh = Date.now();
  if(before !== null){ const d = num(st.me.pendingRewards) - before; if(d > 1e-9) S.pulse = d; }
  if(net.height !== S.lastHeight){ S.prevDiffs = S.curDiffs; S.curDiffs = net.ranks.map(r=>r.difficulty); S.lastHeight = net.height; }
}
async function loadTab(t){
  if(t==='mine'||t==='bag') await loadCore();
  if(t==='store'){ S.store = await api('/store'); if(!S.me) await loadCore(); }
  if(t==='market'){ S.market = await api('/market?sort='+S.sort); if(!S.me) await loadCore(); }
  if(t==='bag'){ S.burns = await api('/miners/burns'); }
  if(t==='tasks'){ [S.tasks, S.myTasks] = await Promise.all([api('/tasks'), api('/tasks/mine')]); if(!S.me) await loadCore(); }
  if(t==='wallet'){ const [w,d] = await Promise.all([api('/wallet'), api('/withdrawals')]); S.wallet=w; S.wds=d; await loadCore(); }
  if(t==='referral'){
  S.referral = await api('/referrals/me');
}
  if(S.tab===t) render();
}
async function refreshCore(){
  if(S.busy) return; S.busy = true;
  try { await loadCore(); if(S.tab==='mine'||S.tab==='bag') render(); else renderChrome(); } catch(e){} finally { S.busy=false; }
}

/* ---------- render ---------- */
function renderChrome(){
  const b = S.me ? S.me.balances : {MINE:'0',TON:'0'};
  $('#bal').innerHTML =
    `<button class="chip" data-act="tab" data-tab="wallet"><img class="coin" src="${COIN}" alt="MINE">${fmt(b.MINE)}</button>
     <button class="chip" data-act="tab" data-tab="wallet"><i class="dot" style="background:var(--ton)"></i>${fmt(b.TON)}</button>`;
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="tab" role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join('');
}
function render(){
  renderChrome(); $('#view').innerHTML = views[S.tab](); updateLive();
  if(S.pulse && S.tab==='mine'){
    const rack=$('#rack');
    if(rack){ rack.classList.add('pulse'); const f=document.createElement('div'); f.className='float'; f.textContent='+'+fmt(S.pulse,4); rack.appendChild(f); setTimeout(()=>f.remove(),1500); }
    S.pulse=0;
  }
}
function setTab(t){ S.tab=t; render(); $('#view').scrollTop=0; run(()=>loadTab(t)); }
function updateLive(){
  const fuse=$('#fuse'); if(!fuse||!S.blockEnd) return;
  const total=S.cfg.blockSeconds*1000, left=Math.max(0,S.blockEnd-Date.now());
  fuse.style.transform=`scaleX(${Math.min(1,1-left/total)})`;
  $('#fuseT').textContent = clock(Math.ceil(left/1000));
}
setInterval(()=>{
  updateLive();
  if(!S.token||S.busy) return;
  const now=Date.now();
  if(S.tab==='mine' && (now>S.blockEnd+4000 || now-S.lastRefresh>45000)) refreshCore();
},500);

function buySheet(id,cur){
  const m=S.store.find(x=>x.id===id), price=cur==='TON'?m.priceTon:m.priceMine, bal=num(S.me.balances[cur]), short=num(price)-bal;
  sheet(`<h3>Buy ${m.name}</h3>
    <div class="sum"><div>${minerSVG(m)}</div><p>${fmt(m.hash,0)} GH/s, takes one slot</p></div>
    <dl><dt>Price</dt><dd>${fmt(price, cur==='TON'?2:0)} ${cur}</dd><dt>Your balance</dt><dd>${fmt(bal)} ${cur}</dd><dt>After purchase</dt><dd>${short>0?'Not enough':fmt(bal-num(price))+' '+cur}</dd></dl>
    ${short>0?`<p class="err">You need ${fmt(short)} more ${cur}. ${cur==='TON'?'Deposit TON in the Wallet tab.':'Claim your mined MINE or sell a miner.'}</p>`:''}
    <button class="btn ${cur==='TON'?'ton':'mine'} wide" data-act="confirmBuy" data-id="${id}" data-cur="${cur}" ${short>0?'disabled':''}>Confirm purchase</button>`);

function slotSheet(i){
  const m=S.miners.find(x=>x.slot===i);
  if(m){ sheet(`<h3>${m.name}</h3><div class="sum"><div>${minerSVG(m)}</div><p>${fmt(m.hash,0)} GH/s, slot ${i+1}</p></div><button class="btn ghost wide" data-act="remove" data-id="${m.id}">Move to storage</button>`); return; }
  const stored=S.miners.filter(x=>x.slot===null&&!x.listed);
  if(!stored.length){ sheet(`<h3>Empty slot</h3><p class="sub">You have no miners in storage. Buy one in the store to fill this slot.</p><button class="btn amber wide" data-act="tab" data-tab="store">Open store</button>`); return; }

}

  sheet(`<h3>Sell ${m.name}</h3><div class="sum"><div>${minerSVG(m)}</div><p>${fmt(m.hash,0)} GH/s. The miner is held in escrow until it sells or you cancel.</p></div>

    <dl><dt>Market fee (${S.cfg.marketFeeBps/100}%)</dt><dd id="feeOut">${fmt(num(def)*fee)} MINE</dd><dt>You receive</dt><dd id="recv">${fmt(num(def)*(1-fee))} MINE</dd></dl>

  const w=S.wallet.withdraw;
  sheet(`<h3>Withdraw MINE</h3>
   <dl><dt>Available</dt><dd>${fmt(S.me.balances.MINE)} MINE</dd><dt>Left today (${w.rank})</dt><dd>${fmt(w.remainingToday,0)} MINE</dd><dt>Minimum</dt><dd>${fmt(w.min,0)} MINE</dd><dt>Withdrawal fee</dt><dd>${fmt(w.fee,0)} MINE</dd><dt>Total deducted</dt><dd id="wdTot">${fmt(w.fee,0)} MINE</dd></dl>
   ${w.eligible?'':`<p class="err">New accounts can withdraw after ${new Date(w.eligibleAt).toLocaleString()}.</p>`}
   <label class="field"><span>Your TON address</span><input id="wdAddr" type="text" autocomplete="off" placeholder="UQ..."></label>
   <label class="field"><span>Amount you receive</span><input id="wdAmt" type="number" inputmode="decimal" placeholder="${w.min}" data-fee="${num(w.fee)}"></label>
   <p class="err" id="wdErr" hidden></p>
   <button class="btn mine wide" data-act="confirmWd" ${w.eligible?'':'disabled'}>Request withdrawal</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'tab': closeSheet(); setTab(d.tab); break;
    case 'close': closeSheet(); break;
    case 'slot': slotSheet(+d.i); break;
    case 'rank': rankSheet(); break;
    case 'claim': run(async()=>{ const r=await api('/claim',{}); await loadCore(); render(); toast(`Claimed ${fmt(r.claimed,4)} MINE`); }); break;
      case 'claimReferral':
  el.disabled = true;
  run(async()=>{
    const r = await api('/referrals/claim',{});
    await loadCore();
    render();
    toast(`Claimed ${fmt(r.claimed,4)} MINE`);
  }).finally(()=>{el.disabled=false});
  break;
    case 'buy': buySheet(d.id,d.cur); break;
    case 'confirmBuy': el.disabled=true; run(async()=>{ await api('/store/buy',{typeId:d.id,currency:d.cur}); await loadCore(); closeSheet(); render(); toast('Miner added to Inventory'); }).finally(()=>{el.disabled=false}); break;
    case 'place': run(async()=>{
      const used=new Set(S.miners.filter(m=>m.slot!==null).map(m=>m.slot)); let i=0; while(used.has(i)) i++;
      if(i>=S.cfg.slots){ toast('Your rack is full. Remove a miner first.'); return; }
      await api('/rack/place',{minerId:+d.id,slot:i}); await loadCore(); render(); toast('Miner placed in your rack'); }); break;
    case 'placeAt': run(async()=>{ await api('/rack/place',{minerId:+d.id,slot:+d.i}); await loadCore(); closeSheet(); render(); toast('Miner placed in your rack'); }); break;
    case 'remove': run(async()=>{ await api('/rack/remove',{minerId:+d.id}); await loadCore(); closeSheet(); render(); toast('Moved to storage'); }); break;
    case 'recycle': { const m=S.miners.find(x=>x.id==d.id); sheet(`<h3>Recycle ${esc(m.name)}?</h3><p class="sub">This Event Miner will be permanently destroyed. This action cannot be undone. The configured reward will be granted if available.</p><button class="btn mine wide" data-act="confirmRecycle" data-id="${m.id}">Confirm permanent burn</button>`); break; }
    case 'confirmRecycle': el.disabled=true; run(async()=>{ const r=await api('/miners/recycle',{minerId:+d.id}); await loadCore(); closeSheet(); render(); toast(r.reward.type==='MINE'?`Recycled for ${fmt(r.reward.amount,2)} MINE`:'Miner recycled; new miner received'); }).finally(()=>{el.disabled=false}); break;
    case 'sell': run(()=>sellSheet(d.id)); break;
    case 'confirmSell': run(async()=>{
      const price=$('#priceIn').value.trim();
      if(!/^\d+(\.\d{1,9})?$/.test(price)){ toast('Enter a valid price'); return; }
      await api('/market/list',{minerId:+d.id,price}); await loadCore(); closeSheet(); S.tab='market'; S.market=await api('/market?sort='+S.sort); render(); toast(`Listed for ${fmt(price,0)} MINE`); }); break;
    case 'cancel': run(async()=>{ await api('/market/cancel',{listingId:+d.id}); S.market=await api('/market?sort='+S.sort); await loadCore(); render(); toast('Listing cancelled, miner returned'); }); break;
    case 'mbuy': {
      const l=S.market.find(x=>x.id==d.id), bal=num(S.me.balances.MINE), short=num(l.price)-bal;
      sheet(`<h3>Buy ${l.name}</h3><div class="sum"><div>${minerSVG(l)}</div><p>${fmt(l.hash,0)} GH/s from ${l.seller}</p></div>
        <dl><dt>Price</dt><dd>${fmt(l.price,0)} MINE</dd><dt>Your balance</dt><dd>${fmt(bal)} MINE</dd><dt>After purchase</dt><dd>${short>0?'Not enough':fmt(bal-num(l.price))+' MINE'}</dd></dl>
        ${short>0?`<p class="err">You need ${fmt(short)} more MINE.</p>`:''}
        <button class="btn mine wide" data-act="confirmMbuy" data-id="${l.id}" ${short>0?'disabled':''}>Confirm purchase</button>`);
      break; }
    case 'confirmMbuy': el.disabled=true; run(async()=>{ await api('/market/buy',{listingId:+d.id}); S.market=await api('/market?sort='+S.sort); await loadCore(); closeSheet(); render(); toast('Miner added to Inventory'); }).finally(()=>{el.disabled=false}); break;
    case 'sort': S.sort=d.k; run(async()=>{ S.market=await api('/market?sort='+S.sort); render(); }); break;
    case 'taskGo': run(async()=>{ try {
      const t=S.tasks.find(x=>x.id==d.id); await api('/tasks/'+t.id+'/start',{});
      S.opened[t.id]=true; render();
      if(/^https:\/\/t\.me\//.test(t.url) && tg && tg.openTelegramLink) tg.openTelegramLink(t.url);
      else if(tg && tg.openLink) tg.openLink(t.url); else window.open(t.url,'_blank');
      toast(t.type==='channel' ? 'Join the channel, then come back and tap Check.' : 'Come back in a few seconds and tap Check.'); } catch(ex){ if(ex.code==='already_member'){ S.tasks=await api('/tasks'); render(); } throw ex; } }); break;
    case 'taskCheck': el.disabled=true; run(async()=>{
      const r=await api('/tasks/'+d.id+'/claim',{}); S.tasks=await api('/tasks'); await loadCore(); render(); toast(`+${fmt(r.reward,0)} MINE earned`); }).finally(()=>{el.disabled=false}); break;
    case 'promote': promoteSheet(); break;
    case 'confirmPromote': {
      const err=$('#prErr'), channel=$('#chIn').value.trim(), budget=$('#budIn').value.trim();
      el.disabled=true;
      api('/tasks/create',{channel,budget}).then(async r=>{
        [S.tasks,S.myTasks]=await Promise.all([api('/tasks'),api('/tasks/mine')]); await loadCore(); closeSheet(); render();
        toast(r.status==='approved'?'Your promotion is live':'Submitted. It goes live after review.');
      }).catch(ex=>{ err.textContent=errText(ex); err.hidden=false; }).finally(()=>{el.disabled=false});
      break; }
    case 'cancelTask': run(async()=>{ const r=await api('/tasks/'+d.id+'/cancel',{}); [S.tasks,S.myTasks]=await Promise.all([api('/tasks'),api('/tasks/mine')]); await loadCore(); render(); toast(`Cancelled. ${fmt(r.refunded,0)} MINE refunded.`); }); break;
    case 'deposit': depositSheet(); break;
    case 'copy': navigator.clipboard && navigator.clipboard.writeText(d.v).then(()=>toast('Copied')); break;
    case 'openWallet': { const dd=S.wallet.deposit, url=`https://app.tonkeeper.com/transfer/${dd.address}?text=${encodeURIComponent(dd.memo)}`; tg && tg.openLink ? tg.openLink(url) : window.open(url,'_blank'); break; }
    case 'withdraw': withdrawSheet(); break;
    case 'confirmWd': {
      const err=$('#wdErr'), amount=$('#wdAmt').value.trim(), address=$('#wdAddr').value.trim();
      if(!/^\d+(\.\d{1,9})?$/.test(amount)){ err.textContent='Enter a valid amount.'; err.hidden=false; break; }
      el.disabled=true;
      api('/withdraw',{amount,address}).then(async r=>{
        S.wallet=await api('/wallet'); S.wds=await api('/withdrawals'); await loadCore(); closeSheet(); render();
        toast(r.status==='approved'?'Withdrawal queued':'Withdrawal sent for review');
      }).catch(ex=>{ err.textContent=errText(ex); err.hidden=false; }).finally(()=>{el.disabled=false});
      break; }
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='wdAmt'){ const v=+e.target.value||0, fee=+e.target.dataset.fee; $('#wdTot').textContent=fmt(v+fee,v+fee%1?2:0)+' MINE'; }
  if(e.target.id==='budIn'){ const v=+e.target.value||0, c=+e.target.dataset.cost; $('#joinsOut').textContent=Math.floor(v/c); $('#totOut').textContent=fmt(v,0)+' MINE'; }
  if(e.target.id==='priceIn'){ const v=+e.target.value||0, f=+e.target.dataset.fee; $('#feeOut').textContent=fmt(v*f)+' MINE'; $('#recv').textContent=fmt(v*(1-f))+' MINE'; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* ---------- start: splash, login ---------- */
try{ if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#0D0A1F'); tg.setBackgroundColor('#0D0A1F'); } }catch(_){}
$('#logo').src = COIN;
$('#art').style.backgroundImage = `url(${SPLASH})`;

async function login(){
  if(!API_URL) throw Object.assign(new Error('no_api'),{code:'no_api'});
  let r;
  if(tg && tg.initData) r = await api('/auth/telegram',{initData:tg.initData});
  else {
    const dev=new URLSearchParams(location.search).get('dev');
    if(!dev) throw Object.assign(new Error('not_in_telegram'),{code:'not_in_telegram'});
    r = await api('/auth/dev',{tgId:Number(dev),username:'dev'+dev});
  }
  S.token = r.token;
  const [cfg] = await Promise.all([api('/config'), loadCore()]);
  S.cfg = {...S.cfg, ...cfg};
}

(function splash(){
  const sp=$('#splash'), msgEl=$('#spMsg');
  requestAnimationFrame(()=>requestAnimationFrame(()=>sp.classList.add('go')));
  const msgs=['Starting the mine','Syncing the network','Checking your rack']; let k=0;
  const mi=setInterval(()=>{ k++; if(k<msgs.length) msgEl.textContent=msgs[k]; },900);
  const minWait=new Promise(r=>setTimeout(r,2900));
  function attempt(){
    sp.classList.remove('ready','fail');
    const p=login();
    Promise.allSettled([p,minWait]).then(([res])=>{
      clearInterval(mi);
      if(res.status==='fulfilled'){
        const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
        $('#enterBtn').textContent = u ? 'Continue as '+(u.username?'@'+u.username:u.first_name) : 'Continue';
        sp.classList.add('ready');
      } else {
        const c=res.reason&&res.reason.code;
        msgEl.textContent = c==='no_api' ? 'Set API_URL in index.html first.' : c==='not_in_telegram' ? 'Open this app from Telegram.' : c==='banned' ? ERR.banned : "Can't reach the server.";
        sp.classList.add('fail');
      }
    });
  }
  attempt();
  $('#enterBtn').addEventListener('click',()=>{
    render(); sp.classList.add('out'); $('#app').classList.add('boot');
    setTimeout(()=>{ $('#app').classList.remove('boot'); sp.remove(); },1800);
  });
  $('#retryBtn').addEventListener('click',()=>{ msgEl.textContent='Reconnecting'; attempt(); });
})();

</script>
